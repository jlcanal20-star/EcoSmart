{% extends "base.html" %}
{% block titulo %}Criar conta - Eco Smart{% endblock %}

{% block conteudo %}
<main>
  <section class="area-conta">
    <div class="caixa-form">
      <h2>Criar conta</h2>
      <p class="texto-form">Leva menos de um minuto.</p>

      <form method="post" class="formulario">
        <label for="usuario">Nome de usuário</label>
        <input type="text" id="usuario" name="usuario" minlength="3" required autofocus>

        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" required>

        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" minlength="6" required>

        <label for="confirmar">Confirmar senha</label>
        <input type="password" id="confirmar" name="confirmar" minlength="6" required>

        <button type="submit">Criar conta</button>
      </form>

      <p class="texto-form">Já tem conta?
        <a href="{{ url_for('login') }}">Entrar</a>
      </p>
    </div>
  </section>
</main>
{% endblock %}
